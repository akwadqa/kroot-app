name: kroot_app
description: "A new Flutter project about wddings and events common."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # auto_route: ^10.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0-dev.17
  riverpod_annotation: ^3.0.0-dev.17
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  dots_indicator: ^4.0.1
  carousel_slider: ^5.0.0
  easy_localization: ^3.0.7
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.3.4
  queen_validators: ^1.0.1
  bcrypt: ^1.1.3
  bot_toast: ^4.1.3
  # lottie: ^3.3.1
  webview_flutter: ^4.10.0
  another_stepper: ^1.2.2
  mockito: ^5.4.5
  flutter_dotenv: ^6.0.0
  pretty_dio_logger: ^1.4.0
  image_picker: ^1.2.0
  flutter_native_splash: ^2.4.6
  equatable: ^2.0.7
  device_preview: ^1.3.1
  mobile_scanner: ^7.0.1
  animated_bottom_navigation_bar: ^1.4.0
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  intl_phone_field: ^3.2.0
  pinput: ^5.0.2
  firebase_core: ^3.13.0
  dropdown_button2: ^2.3.9
  go_router: ^16.2.4
  internet_connection_checker: ^3.0.1
  dotted_border: ^3.1.0
  flutter_contacts: ^1.1.9+2
  toastification: ^3.0.3
  uuid: ^4.5.1
  file_picker: ^10.3.6
  csv: ^6.0.0
  excel: ^4.0.6
  google_maps_flutter: ^2.14.0
  # google_places_flutter: ^2.1.1
  flutter_google_places_sdk: ^0.4.2+1
  geolocator: ^14.0.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0
  fcm_config: ^3.6.5
  quickalert: ^1.1.0
  keyboard_actions: ^4.2.1
  package_info_plus: ^9.0.0





dev_dependencies:
  flutter_test:
    sdk: flutter
  # analyzer: ^7.0.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0-dev.17
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0-dev.17
  # auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.8.0
  freezed: ^3.2.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
dependency_overrides:
  analyzer_plugin: ^0.13.1
  archive: ^3.4.10

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true 

  image_path: "assets/images/kroot_icon.png"
  # adaptive_icon_background: "#1E2E4F"   # الخلفية التي تريدها
  # adaptive_icon_foreground: "assets/images/kroot_icon.png"
  android_12:
    image: "assets/images/kroot_icon.png"
    # color: "#1E2E4F"         # خلفية Android 12
    fullscreen: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/fonts/
    - .env
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Medium.ttf
          style: italic
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_gen:
  integrations:
    flutter_svg: true
flutter_intl:
  enabled: true
